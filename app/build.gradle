apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.mikepenz.aboutlibraries.plugin.android'

android {
    namespace "org.shadowice.flocke.andotp"
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "org.shadowice.flocke.andotp"
        minSdkVersion 28
        targetSdkVersion 35
        versionCode 39
        versionName "0.9.0.1"
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix = ".dev"
            versionNameSuffix = "-dev"
            testCoverageEnabled = true

            tasks.withType(JavaCompile) {
                options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
            }
        }
    }
    lint {
        abortOnError true
        // An initial focused gate, not a fabricated full-project lint baseline.
        checkOnly 'NewApi', 'InlinedApi', 'TrustAllX509TrustManager',
                'BadHostnameVerifier', 'SslCertificateSocketFactoryCreateInsecure'
        warningsAsErrors true
    }
    buildFeatures {
        dataBinding = true
    }
    flavorDimensions 'market'
    productFlavors {
        fdroid {
            dimension = 'market'
        }
        play {
            dimension = 'market'
            versionNameSuffix = "-play"
        }
    }
    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true

        // Sets Java compatibility to Java 8
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Match Java bytecode without changing min/target SDK or introducing a toolchain download.
kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8)
    }
}

dependencies {
    implementation('org.jetbrains.kotlin:kotlin-stdlib:2.3.20') {
        version { strictly '2.3.20' }
    }

    def lifecycle_version = "2.10.0"

    implementation 'androidx.media:media:1.8.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation "androidx.lifecycle:lifecycle-process:${lifecycle_version}"
    implementation "androidx.lifecycle:lifecycle-common-java8:${lifecycle_version}"
    implementation "androidx.work:work-runtime:2.12.0"
    implementation 'com.google.android.material:material:1.14.0'

    //noinspection GradleDependency - because they messed up their version numbering
    implementation "commons-codec:commons-codec:1.23.0"
    implementation "com.github.aakira:expandable-layout:1.6.0"
    implementation "com.heinrichreimersoftware:material-intro:2.0.0"
    implementation("com.journeyapps:zxing-android-embedded:4.3.0") { transitive = false }
    implementation('com.google.zxing:core:3.5.4')
    implementation "me.zhanghai.android.materialprogressbar:library:1.6.1"
    implementation "com.github.open-keychain.open-keychain:openpgp-api:v5.7.1"
    implementation "com.leinardi.android:speed-dial:3.3.0"
    implementation "com.mikepenz:aboutlibraries:14.2.1"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation "androidx.test.espresso:espresso-core:3.7.0"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
