name: Android build and security regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  policy:
    name: Security policy tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.9'
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: python3 scripts/check_build_inputs.py
      - run: python3 -m unittest discover -s scripts/tests -v

  build:
    name: Both flavors and independent unsigned release builds
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17.0.14+7'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Dependency inventory artifact-selection regression
        run: |
          ./gradlew --no-daemon --version
          GRADLE_EXECUTABLE="$PWD/gradlew" python3 scripts/tests/test_dependency_inventory.py -v
      - name: Host regression tests, focused lint and debug APKs
        shell: bash
        run: |
          (while true; do echo "$(date +%T) $(free -m | awk '/Mem:/{print "used=" $3 "MB"}')"; sleep 5; done) > mem-host.log 2>&1 &
          rc=0
          ./gradlew --no-daemon \
            :app:testFdroidDebugUnitTest :app:testPlayDebugUnitTest \
            :app:lintFdroidRelease :app:lintPlayRelease \
            :app:assembleFdroidDebug :app:assemblePlayDebug > gradle-host.log 2>&1 || rc=$?
          echo "gradle exit code: $rc" >> gradle-host.log
          exit $rc
      - name: Publish Gradle failure context
        if: failure()
        run: |
          python3 scripts/diagnose_ci_failure.py gradle-host.log mem-host.log
          python3 scripts/ci_failure_annotation.py gradle-host.log
          # Lint reports every finding in its text report; Gradle only prints the first one.
          for report in app/build/intermediates/lint_intermediate_text_report/*/lintReport*/lint-results-*.txt; do
            [ -f "$report" ] && python3 scripts/ci_failure_annotation.py "$report"
          done
          true
      - name: Compare independent builds and inspect packaged manifests
        run: |
          set -o pipefail
          mkdir -p reports/reproducibility
          bash scripts/verify_reproducible_build.sh 2>&1 | tee reports/reproducibility/verify.log
      - name: Publish reproducibility failure context
        if: failure()
        run: |
          if [ -f reports/reproducibility/verify.log ]; then
            python3 scripts/ci_failure_annotation.py reports/reproducibility/verify.log
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: build-and-reproducibility-reports
          retention-days: 14
          path: |
            reports/reproducibility/
            app/build/reports/
            app/build/test-results/
            gradle-host.log
            mem-host.log

  android-tests:
    name: ${{ matrix.flavor }} security tests on API ${{ matrix.api }}
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        flavor: [Fdroid, Play]
        api: [28, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17.0.14+7'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/ci_emulator_tests.sh ${{ matrix.flavor }}
      - name: Publish Gradle failure context
        if: failure()
        run: |
          python3 scripts/diagnose_ci_failure.py gradle-install.log gradle-connected.log mem-emulator.log
          for log in gradle-install.log gradle-connected.log; do
            [ -f "$log" ] && python3 scripts/ci_failure_annotation.py "$log"
          done
          python3 scripts/ci_androidtest_failures.py
          true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-tests-${{ matrix.flavor }}-api-${{ matrix.api }}
          retention-days: 14
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            gradle-install.log
            gradle-connected.log
            mem-emulator.log
