name: Android build and security regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  policy:
    name: Security policy tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.9'
      - uses: gradle/actions/wrapper-validation@41ad77ca97e46ee2e825d5e6b9a95d8169fcc44c # v4.4.2
      - run: python3 scripts/check_build_inputs.py
      - run: python3 -m unittest discover -s scripts/tests -v

  build:
    name: Both flavors and independent unsigned release builds
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17.0.14+7'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Host regression tests, focused lint and debug APKs
        shell: bash
        run: |
          rc=0
          ./gradlew --no-daemon \
            :app:testFdroidDebugUnitTest :app:testPlayDebugUnitTest \
            :app:lintFdroidRelease :app:lintPlayRelease \
            :app:assembleFdroidDebug :app:assemblePlayDebug > gradle-host.log 2>&1 || rc=$?
          echo "gradle exit code: $rc" >> gradle-host.log
          free -m >> gradle-host.log 2>&1 || true
          sudo -n dmesg 2>/dev/null | grep -i -E 'killed process|out of memory' | tail -5 >> gradle-host.log || true
          exit $rc
      - name: Publish Gradle failure context
        if: failure()
        run: python3 scripts/ci_failure_annotation.py gradle-host.log
      - name: Compare independent builds and inspect packaged manifests
        run: bash scripts/verify_reproducible_build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: build-and-reproducibility-reports
          retention-days: 14
          path: |
            reports/reproducibility/
            app/build/reports/
            app/build/test-results/
            gradle-host.log

  android-tests:
    name: ${{ matrix.flavor }} security tests on API ${{ matrix.api }}
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        flavor: [Fdroid, Play]
        api: [28, 36]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17.0.14+7'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            set -e
            rc=0; ./gradlew --no-daemon :security-test-client:installDebug > gradle-install.log 2>&1 || rc=$?
            echo "gradle exit code: $rc" >> gradle-install.log; free -m >> gradle-install.log 2>&1 || true
            [ "$rc" -eq 0 ]
            rc=0; ./gradlew --no-daemon :app:connected${{ matrix.flavor }}DebugAndroidTest > gradle-connected.log 2>&1 || rc=$?
            echo "gradle exit code: $rc" >> gradle-connected.log; free -m >> gradle-connected.log 2>&1 || true
            sudo -n dmesg 2>/dev/null | grep -i -E 'killed process|out of memory' | tail -5 >> gradle-connected.log || true
            [ "$rc" -eq 0 ]
      - name: Publish Gradle failure context
        if: failure()
        run: |
          for log in gradle-install.log gradle-connected.log; do
            [ -f "$log" ] && python3 scripts/ci_failure_annotation.py "$log"
          done
          true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: android-tests-${{ matrix.flavor }}-api-${{ matrix.api }}
          retention-days: 14
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            gradle-install.log
            gradle-connected.log
