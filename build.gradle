// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    configurations.classpath {
        // Dependency locking and the fail-on-dynamic/changing modes are mutually exclusive in
        // Gradle 8.13. The checked-in declarations are exact; locking owns graph reproducibility.
        resolutionStrategy.activateDependencyLocking()
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath('org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.20') {
            version { strictly '2.3.20' }
        }
        classpath 'com.mikepenz.aboutlibraries.plugin:aboutlibraries-plugin:14.2.1'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        exclusiveContent {
            forRepository { maven { url "https://jitpack.io" } }
            filter {
                includeGroup 'com.github.aakira'
                includeGroup 'com.github.open-keychain.open-keychain'
            }
        }
    }
}

// Dependency locking owns the resolved version graph.
allprojects {
    dependencyLocking {
        lockAllConfigurations()
        // Gradle's default mode permits bootstrapping when lockfiles are absent.
        // Reviewed lockfiles, once present, are enforced on normal builds.
    }
    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}

apply from: 'gradle/dependency-inventory.gradle'

task clean(type: Delete) {
    delete rootProject.buildDir
}
