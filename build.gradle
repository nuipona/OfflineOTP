// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    configurations.classpath {
        // Gradle rejects these guards together with dependency locking (see below).
        resolutionStrategy.failOnDynamicVersions()
        resolutionStrategy.failOnChangingVersions()
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath('org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.20') {
            version { strictly '2.3.20' }
        }
        classpath 'com.mikepenz.aboutlibraries.plugin:aboutlibraries-plugin:14.2.1'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        exclusiveContent {
            forRepository { maven { url "https://jitpack.io" } }
            filter {
                includeGroup 'com.github.aakira'
                includeGroup 'com.github.open-keychain.open-keychain'
            }
        }
    }
}

// Reject floating/changing dependencies instead of accepting a different graph silently.
// Dependency locking is not enabled: Gradle refuses it together with these guards, and no
// lockfiles are committed. Every version is pinned, so the guards enforce the same graph today.
allprojects {
    configurations.configureEach {
        resolutionStrategy.failOnDynamicVersions()
        resolutionStrategy.failOnChangingVersions()
    }
    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}

apply from: 'gradle/dependency-inventory.gradle'

task clean(type: Delete) {
    delete rootProject.buildDir
}
